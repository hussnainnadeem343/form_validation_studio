project:
  name: "Demo Application Form Validation"

application:
  base_url: "http://127.0.0.1:8080/login.html"
  target_url: "http://127.0.0.1:8080/create_user.html"

login:
  # Credentials fallback if env vars TEST_USERNAME / TEST_PASSWORD are not set
  username: "admin"
  password: "Admin@123456"
  wait_seconds: 0

  # Optional explicit selectors (framework automatically detects them if left empty)
  selectors:
    username: ""
    password: ""
    submit: ""

browser:
  browser: "chromium"
  headless: true
  slow_mo: 50
  timeout: 30000

execution:
  screenshot_on_failure: true
  screenshot_on_observation: true
  stop_on_failure: false
  output_dir: "reports"
  screenshots_dir: "screenshots"

rules:
  username:
    required: true
    min_length: 3
    max_length: 50
    allow_spaces: false
    allow_special_chars: false

  full_name:
    required: true
    min_length: 2
    max_length: 100

  email:
    required: true

  password:
    required: true
    min_length: 12
    uppercase: true
    lowercase: true
    number: true
    special_character: true

  confirm_password:
    required: true

  phone:
    required: false
    min_length: 10
    max_length: 15
    numeric_only: true

  number:
    required: false
    min: 18
    max: 99
    allow_decimal: false
    allow_negative: false

  dropdown:
    required: false

# Example overrides if an application uses non-standard field names
field_overrides:
  # user_role:
  #   semantic_type: "DROPDOWN"
