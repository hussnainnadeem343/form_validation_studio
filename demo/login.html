<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Portal - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 400px; padding: 32px; }
        h2 { font-size: 24px; color: #1e293b; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .btn-submit {
            width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .btn-submit:hover { background: #1d4ed8; }
        .alert-danger {
            background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign In</h2>
        <p class="subtitle">Enter your admin credentials</p>

        <div id="login-error" class="alert-danger" role="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password" />
            </div>

            <button type="submit" id="login-btn" class="btn-submit">Login</button>
        </form>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;
            const errBox = document.getElementById("login-error");

            if (u === "admin" && p === "Admin@123456") {
                sessionStorage.setItem("authenticated", "true");
                window.location.href = "create_user.html";
            } else {
                errBox.innerText = "Invalid credentials. Please enter valid admin username and password.";
                errBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
